quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos2db
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.schema-management.strategy=update

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers= *, Authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# configuracao do seaweedfs
seaweedfs.master.url=http://localhost:9333
seaweedfs.request-timeout-ms=10000

# Dev service do SeaweedFS desabilitado no ambiente atual porque o container depende de Docker.
# Se você quiser usar SeaweedFS localmente, ative este recurso em uma máquina com Docker disponível.
%dev.seaweedfs.devservice.enabled=true
